<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff4e6;
            color: #3b241c;
        }

        header {
            background: #4a3028;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
            width: 100%;
            background: #8b4b35;
            padding: 18px 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        nav a:hover {
            color: #ffd9a0;
        }

        .banner {
            height: 250px;
            background-image:
                linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                url("https://images.unsplash.com/photo-1559329007-40df8a9345d8?w=1400");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .banner h2 {
            font-size: 35px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .form-box h2 {
            text-align: center;
            color: #8b4b35;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #c9a99a;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            background: #8b4b35;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #5c3023;
        }

        .cancel-btn {
            background: #777;
        }

        .table-box {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }

        .table-box h2 {
            text-align: center;
            color: #8b4b35;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th, td {
            border: 1px solid #ddc5b8;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #8b4b35;
            color: white;
        }

        tr:nth-child(even) {
            background: #fff4e6;
        }

        .staff-image {
            width: 65px;
            height: 55px;
            object-fit: cover;
            border-radius: 5px;
        }

        footer {
            background: #4a3028;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Restaurant Reservation System</h1>
        <p>Manage Restaurant Staff</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="customers.html">Customers</a>
        <a href="tables.html">Tables</a>
        <a href="reservations.html">Reservations</a>
        <a href="staff.html">Staff</a>
    </nav>

    <section class="banner">
        <h2>Our Restaurant Staff</h2>
    </section>

    <div class="container">

        <div class="form-box">
            <h2>Staff Details</h2>

            <form id="staffForm">

                <input type="hidden" id="staff_id">

                <label>Staff Name</label>
                <input type="text" id="staff_name"
                       placeholder="Enter staff name" required>

                <label>Email</label>
                <input type="email" id="email"
                       placeholder="Enter email" required>

                <label>Phone Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter phone number" required>

                <label>Role</label>
                <select id="role" required>
                    <option value="">Select Role</option>
                    <option value="Manager">Manager</option>
                    <option value="Waiter">Waiter</option>
                    <option value="Chef">Chef</option>
                    <option value="Receptionist">Receptionist</option>
                </select>

                <label>Shift</label>
                <select id="shift" required>
                    <option value="">Select Shift</option>
                    <option value="Morning">Morning</option>
                    <option value="Evening">Evening</option>
                    <option value="Night">Night</option>
                </select>

                <button type="submit" id="submitBtn">Add Staff</button>
                <button type="button" class="cancel-btn"
                        onclick="resetForm()">Clear</button>

            </form>
        </div>

        <div class="table-box">
            <h2>Staff List</h2>

            <table>
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Role</th>
                        <th>Shift</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="staffTable">
                </tbody>
            </table>
        </div>

    </div>

    <footer>
        <p>Restaurant Reservation System | All Rights Reserved</p>
    </footer>

    <script>
        const staffForm = document.getElementById("staffForm");

        // READ: Display all staff
        async function loadStaff() {
            try {
                const response = await fetch("/staff");
                const staff = await response.json();

                const table = document.getElementById("staffTable");
                table.innerHTML = "";

                staff.forEach(person => {
                    table.innerHTML += `
                        <tr>
                            <td>
                                <img class="staff-image"
                                src="https://images.unsplash.com/photo-1551836022-d5d88e9218df?w=200"
                                alt="Staff">
                            </td>
                            <td>${person.staff_id}</td>
                            <td>${person.staff_name}</td>
                            <td>${person.email}</td>
                            <td>${person.phone}</td>
                            <td>${person.role}</td>
                            <td>${person.shift}</td>
                            <td>
                                <button onclick="editStaff(${person.staff_id})">
                                    Edit
                                </button>
                                <button onclick="deleteStaff(${person.staff_id})">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;
                });

            } catch (error) {
                alert("Unable to load staff details.");
                console.error(error);
            }
        }

        // CREATE and UPDATE
        staffForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const id = document.getElementById("staff_id").value;

            const staffData = {
                staff_name: document.getElementById("staff_name").value,
                email: document.getElementById("email").value,
                phone: document.getElementById("phone").value,
                role: document.getElementById("role").value,
                shift: document.getElementById("shift").value
            };

            try {
                let response;

                if (id) {
                    response = await fetch("/staff/" + id, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(staffData)
                    });
                } else {
                    response = await fetch("/staff", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(staffData)
                    });
                }

                if (!response.ok) {
                    throw new Error("Request failed");
                }

                alert(id ? "Staff updated successfully!" :
                            "Staff added successfully!");

                resetForm();
                loadStaff();

            } catch (error) {
                alert("Unable to save staff details.");
                console.error(error);
            }
        });

        // UPDATE: Get staff details for editing
        async function editStaff(id) {
            try {
                const response = await fetch("/staff");
                const staff = await response.json();

                const person = staff.find(item =>
                    Number(item.staff_id) === Number(id)
                );

                if (!person) {
                    alert("Staff record not found.");
                    return;
                }

                document.getElementById("staff_id").value = person.staff_id;
                document.getElementById("staff_name").value = person.staff_name;
                document.getElementById("email").value = person.email;
                document.getElementById("phone").value = person.phone;
                document.getElementById("role").value = person.role;
                document.getElementById("shift").value = person.shift;

                document.getElementById("submitBtn").textContent = "Update Staff";

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            } catch (error) {
                alert("Unable to get staff details.");
                console.error(error);
            }
        }

        // DELETE
        async function deleteStaff(id) {
            if (!confirm("Are you sure you want to delete this staff member?")) {
                return;
            }

            try {
                const response = await fetch("/staff/" + id, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    throw new Error("Delete failed");
                }

                alert("Staff deleted successfully!");
                loadStaff();

            } catch (error) {
                alert("Unable to delete staff.");
                console.error(error);
            }
        }

        // CLEAR FORM
        function resetForm() {
            staffForm.reset();
            document.getElementById("staff_id").value = "";
            document.getElementById("submitBtn").textContent = "Add Staff";
        }

        // Load staff when page opens
        loadStaff();
    </script>

</body>
</html>
