<!DOCTYPE html>
<html>
<head>
    <title>Customer Management</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #fff8f0;
            color: #492c20;
        }

        header {
            background: #492c20;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 25px;
            width: 100%;
            background: #8b4b35;
            padding: 18px 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        nav a:hover {
            color: #ffd9a0;
        }

        .banner {
            height: 220px;
            background:
                linear-gradient(rgba(0,0,0,.4), rgba(0,0,0,.4)),
                url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1400")
                center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0002;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #c9a99b;
            border-radius: 6px;
        }

        button {
            padding: 11px 20px;
            background: #8b4b35;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #492c20;
        }

        .table-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #492c20;
            color: white;
        }

        tr:nth-child(even) {
            background: #fff0e5;
        }

        .delete {
            background: #a33b32;
        }

        footer {
            background: #492c20;
            color: white;
            text-align: center;
            padding: 18px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Restaurant Reservation System</h1>
        <p>Customer Management</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="customers.html">Customers</a>
        <a href="tables.html">Tables</a>
        <a href="reservations.html">Reservations</a>
        <a href="staff.html">Staff</a>
    </nav>

    <div class="banner">
        <h2>Our Valued Customers</h2>
    </div>

    <div class="container">

        <div class="form-box">
            <h2>Add Customer Details</h2>

            <form id="customerForm">

                <input type="text" id="name"
                    placeholder="Customer Name" required>

                <input type="email" id="email"
                    placeholder="Email Address" required>

                <input type="text" id="phone"
                    placeholder="Phone Number" required>

                <input type="password" id="password"
                    placeholder="Password" required>

                <button type="submit" id="submitBtn">
                    Add Customer
                </button>

                <button type="button" onclick="resetForm()">
                    Clear
                </button>

            </form>
        </div>

        <div class="table-box">
            <h2>Customer Details</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Password</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="customerList"></tbody>
            </table>
        </div>

    </div>

    <footer>
        <p>© 2026 Restaurant Reservation System. All Rights Reserved.</p>
    </footer>

    <script>

        let editId = null;

        async function loadCustomers() {

            try {
                const response = await fetch("/customers");
                const customers = await response.json();

                const list = document.getElementById("customerList");
                list.innerHTML = "";

                customers.forEach(customer => {

                    list.innerHTML += `
                        <tr>
                            <td>${customer.customer_id}</td>
                            <td>${customer.name}</td>
                            <td>${customer.email}</td>
                            <td>${customer.phone}</td>
                            <td>********</td>
                            <td>
                                <button onclick="editCustomer(${customer.customer_id})">
                                    Edit
                                </button>

                                <button class="delete"
                                    onclick="deleteCustomer(${customer.customer_id})">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    `;
                });

            } catch (error) {
                alert("Unable to load customers. Check server.js.");
                console.error(error);
            }
        }

        document.getElementById("customerForm")
            .addEventListener("submit", async function(e) {

                e.preventDefault();

                const customer = {
                    name: document.getElementById("name").value,
                    email: document.getElementById("email").value,
                    phone: document.getElementById("phone").value,
                    password: document.getElementById("password").value
                };

                try {

                    let response;

                    if (editId === null) {

                        response = await fetch("/customers", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(customer)
                        });

                    } else {

                        response = await fetch("/customers/" + editId, {
                            method: "PUT",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(customer)
                        });

                    }

                    if (!response.ok) {
                        alert("Operation failed. Check the details.");
                        return;
                    }

                    alert(editId === null
                        ? "Customer Added Successfully!"
                        : "Customer Updated Successfully!");

                    resetForm();
                    loadCustomers();

                } catch (error) {
                    alert("Server connection error.");
                    console.error(error);
                }
            });

        async function editCustomer(id) {

            const response = await fetch("/customers");
            const customers = await response.json();

            const customer = customers.find(
                c => c.customer_id === id
            );

            if (customer) {

                editId = id;

                document.getElementById("name").value = customer.name;
                document.getElementById("email").value = customer.email;
                document.getElementById("phone").value = customer.phone;
                document.getElementById("password").value = "";

                document.getElementById("password").required = false;

                document.getElementById("submitBtn").innerText =
                    "Update Customer";

                window.scrollTo(0, 0);
            }
        }

        async function deleteCustomer(id) {

            if (confirm("Are you sure you want to delete this customer?")) {

                const response = await fetch("/customers/" + id, {
                    method: "DELETE"
                });

                if (response.ok) {
                    alert("Customer Deleted Successfully!");
                    loadCustomers();
                } else {
                    alert("Unable to delete customer.");
                }
            }
        }

        function resetForm() {

            document.getElementById("customerForm").reset();

            document.getElementById("password").required = true;

            document.getElementById("submitBtn").innerText =
                "Add Customer";

            editId = null;
        }

        loadCustomers();

    </script>

</body>
</html>
